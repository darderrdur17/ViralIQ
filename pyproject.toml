[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viraliq"
version = "1.0.0"
description = "TikTok virality intelligence: leakage-controlled prediction, trend analytics and model evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "duckdb>=2.0.0",
    "polars>=2.1.0",
    "pyarrow>=26.0.0",
    "pandas>=3.1.0",
    "numpy>=2.0",
    "pytz>=2024.1",
    "scikit-learn>=1.5",
    "lightgbm>=4.7.0",
    "catboost>=1.2.10",
    "shap>=0.46",
    "joblib>=1.4",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools]
packages = ["src", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E9", "B"]
# B008: FastAPI's File()/Depends() in defaults is the documented idiom.
ignore = ["B008"]
