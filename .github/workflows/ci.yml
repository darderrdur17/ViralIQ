name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check src api scripts tests deploy/vercel/api

      - name: Tests
        # Model artefacts are not committed, so tests that need a trained model
        # skip themselves. Everything else must pass.
        run: pytest tests/ -q

      - name: Serverless mirror is in sync with src/
        # Fails if src/ changed without re-running scripts/export_portable.py,
        # which would ship a stale feature pipeline to Vercel.
        run: pytest tests/test_deploy_sync.py -q
